name: Telegram Bot Commands

on:
  schedule:
    # Polling is only the FALLBACK path (webhook gives instant replies and the
    # poller self-disables when a webhook is set) — */15 keeps Actions cost low.
    - cron: "*/15 * * * *"    # Every 15 minutes, 24/7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-commands
  cancel-in-progress: false

jobs:
  poll:
    name: Check Telegram Commands
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process bot commands
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_GITHUB_TOKEN:    ${{ secrets.GIST_GITHUB_TOKEN }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python bot_commands.py
