name: Gold Price Monitor

on:
  schedule:
    # NOTE: UTC. BKK = UTC+7. We stop at 16 UTC (= 23:00-23:55 BKK) on purpose:
    # 17 UTC would be 00:00-00:55 BKK the *next* day, which used to steal the
    # first-run-of-day slot and suppress the morning message.
    - cron: "*/5 0-16 * * 1-5"  # Mon-Fri: every 5min, 07:00-23:55 BKK
    - cron: "*/5 0-16 * * 6"    # Sat:     every 5min, 07:00-23:55 BKK
    - cron: "*/5 10-16 * * 0"   # Sun:     every 5min, 17:00-23:55 BKK
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Check Gold Price
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run gold monitor
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_THRESHOLD:       ${{ vars.DROP_THRESHOLD || '0.5' }}
          GIST_GITHUB_TOKEN:    ${{ secrets.GIST_GITHUB_TOKEN }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_monitor.py
