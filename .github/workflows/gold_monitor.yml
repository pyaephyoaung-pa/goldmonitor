name: Gold Price Monitor

on:
  schedule:
    # 24/7, every 5 min. Gold trades ~24h on weekdays (the US/EU session is the
    # BKK overnight), and the morning message no longer depends on the first run
    # landing in the morning (it is gated by `morning_sent`), so running around
    # the clock is safe AND closes the overnight gap that hid drop alerts.
    # Finer 5-min sampling catches sharp dips a 15-min poll could skip over.
    #
    # Repo is PUBLIC → unlimited Actions minutes, so */5 is fine. (If it ever
    # goes private again, widen this to */15–*/30 to stay under the 2,000-min cap.)
    #
    # In practice this is only a BACKSTOP. GitHub runs scheduled workflows on a
    # best-effort basis, and over 34 days in Sep–Oct 2026 it delivered 4–8
    # runs a day — a median of 4 hours apart, up to 9 — not 288. The reliable
    # trigger is an external cron calling workflow_dispatch every 5 minutes
    # (README → Step 6); a manual dispatch started within 2 seconds. Keep this
    # schedule anyway, so the monitor still runs if that trigger ever stops.
    # The monitor warns the owner when runs fall more than 90 minutes apart.
    - cron: "*/5 * * * *"
  # Primary trigger — see above. Overlap is impossible: the concurrency group
  # below queues at most one run, and a newer request replaces a queued one
  # (shown as "cancelled" in the Actions list; that is expected).
  workflow_dispatch:

permissions:
  contents: read

# Never let two monitor runs overlap — overlapping runs race on the shared
# Gist (read-modify-write) and can clobber each other's state/alert flags.
concurrency:
  group: gold-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check Gold Price
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip  # restore wheels from cache — big per-run time saver

      - name: Install dependencies
        # requirements-ml.txt pulls in requirements.txt and adds numpy +
        # scikit-learn: this is the only job that TRAINS the models.
        run: pip install -r requirements-ml.txt

      - name: Run gold monitor
        env:
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_THRESHOLD:       ${{ vars.DROP_THRESHOLD || '0.5' }}
          GIST_GITHUB_TOKEN:    ${{ secrets.GIST_GITHUB_TOKEN }}
          GIST_ID:              ${{ secrets.GIST_ID }}
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python gold_monitor.py
